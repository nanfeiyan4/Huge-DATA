# Index-advisor lab: PostgreSQL 16 settings for reproducible measurement.
# Installed as /etc/postgresql/16/main/conf.d/10-idxlab.conf
#
# Pick shared_buffers / effective_cache_size according to the machine:
#   32 GiB RAM -> shared_buffers 8GB,  effective_cache_size 24GB
#   16 GiB RAM -> shared_buffers 4GB,  effective_cache_size 10GB
#   64 GiB RAM -> shared_buffers 16GB, effective_cache_size 48GB

listen_addresses = 'localhost'
max_connections = 64

shared_buffers = 8GB
work_mem = 256MB
maintenance_work_mem = 2GB
effective_cache_size = 24GB

# JOB has 12-way joins; higher stats targets make planner costs trustworthy.
default_statistics_target = 500
random_page_cost = 4.0
seq_page_cost = 1.0
effective_io_concurrency = 200

max_wal_size = 8GB
min_wal_size = 2GB
wal_compression = on

# --- stability first -------------------------------------------------------
# JIT can kick in randomly on heavy JOB queries and adds huge variance.
jit = off
# Parallelism is a second axis; keep it at 0 for the main experiments and run a
# separate small group with 2-4 workers if you want to discuss interaction.
max_parallel_workers_per_gather = 0
# Autovacuum is unnecessary on a read-only benchmark and would inject I/O noise.
autovacuum = off

timezone = 'UTC'
log_min_duration_statement = -1
log_checkpoints = off
log_lock_waits = on
